services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: ${API_BASE_URL:-${VITE_API_BASE_URL:-http://localhost:8000}}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: !override
      - "8080:5173"
